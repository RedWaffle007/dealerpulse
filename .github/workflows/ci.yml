name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: dealerpulse

jobs:
  static-and-unit:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dealerpulse/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck:e2e
      - run: npm test

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dealerpulse/package-lock.json
      - run: npm ci

      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - run: npm run build

      - name: Run e2e suite
        run: npx playwright test

      - name: Job summary
        if: always()
        run: cat test-results/quality-summary.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: dealerpulse/playwright-report
          retention-days: 14

      - name: Upload traces of failures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: dealerpulse/test-results
          retention-days: 7
